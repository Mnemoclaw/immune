# ============================================================
# Immune System — Configuration v5.3.3
# ============================================================
# Hybrid adaptive system: Cheatsheet (positive) + Immune (negative)
# Search: Vector engine (daemon fast path OR local embeddings, primary)
#         + SQLite FTS4 (secondary), fused via RRF. Optional
#         cross-encoder re-ranking when a daemon is reachable.
# Adapter CLI: immune-adapter.js (standalone, no external services needed)
# Can be used independently (/immune) or by Chimera.
# ============================================================

immune:
  version: "5.3.3"
  # Model used for immune scanning (cheap/fast model recommended).
  # "haiku" is a logical alias resolved by Claude Code via env vars:
  #   ANTHROPIC_DEFAULT_HAIKU_MODEL  — set to your provider's fast/cheap model
  #   ANTHROPIC_DEFAULT_SONNET_MODEL — the balanced tier (used by /immune full mode)
  #   ANTHROPIC_BASE_URL             — point at any Messages-API-compatible endpoint
  # Works with: Anthropic, OpenRouter, Mistral, GLM, Ollama, llama.cpp, vLLM, LM Studio, etc.
  # Only the *scan* step calls a model. Search, dedup, injection, scoring are fully local.
  scan_model: "haiku"
  memory_path: "immune_memory.json"
  cheatsheet_path: "cheatsheet_memory.json"
  auto_add_threats: true
  auto_add_strategies: true
  severity_levels: [critical, warning, info]
  domains_multi: true  # antibodies/strategies use "domains" array, not single "domain"

# Tiered memory — keeps active set small for optimal Haiku performance
# Benchmark showed sweet spot at 13-20 antibodies (F1=0.94)
# Beyond 20, precision drops (more false positives)
tiers:
  hot:
    max_per_scan: 15
    # An antibody/strategy is HOT if ANY of these conditions is true:
    criteria:
      - "severity == critical"       # antibodies only
      - "effectiveness >= 0.7"       # strategies only
      - "seen_count >= 3"
      - "last_seen < 30 days ago"
  cold:
    # COLD items are sent as a one-line topic summary (not full details)
    summary_format: "comma-separated pattern keywords"
    # If scanner detects something matching a COLD item → reactivate it
    reactivation: true

# Cheatsheet — positive patterns injected BEFORE generation
cheatsheet:
  max_hot: 15
  # Naming convention (documentation only — not read by the adapter):
  # antibodies are AB-<DOMAIN>-<NNN>, strategies are CS-<DOMAIN>-<NNN>.
  # Keep your own domain list in a local config so this file stays publishable.
  # Default effectiveness for new strategies (0.0-1.0)
  default_effectiveness: 0.5
  # Strategies below this effectiveness are candidates for removal
  min_effectiveness: 0.2

# Domain hints for auto-detection
# You can add custom domains or edit keywords to match your content
domain_keywords:
  code: ["function", "class", "import", "const", "let", "var", "def", "return", "async", "await", "SQL", "API", "endpoint", "worker", "fetch", "query"]
  domain: ["séries", "reps", "exercice", "muscle", "squat", "curl", "programme", "entraînement", "sets", "workout", "deload", "hypertrophie"]
  writing: ["paragraphe", "article", "rédaction", "contenu", "SEO", "paragraph", "content", "blog", "D1", "traduction", "FAQ", "musculation blog", "slug"]
  research: ["source", "étude", "analyse", "hypothèse", "study", "analysis", "findings"]
  strategy: ["marché", "compétiteur", "ROI", "market", "competitor", "revenue", "pivot"]
  webdesign: ["CSS", "HTML", "responsive", "CTA", "landing page", "UI", "UX", "layout"]
  travel: ["voyage", "travel", "viaje", "plage", "beach", "hôtel", "hotel", "tourisme", "tourism", "itinéraire", "budget", "sécurité", "safety", "transport", "visa", "El Salvador", "destination", "guide"]

# ============================================================
# Adapter + SQLite + Migration
# ============================================================

adapter:
  script: "immune-adapter.js"
  db_path: "immune.sqlite"

# ============================================================
# Optional Embed Daemon (GPU acceleration — zero mandatory dependency)
# ============================================================
# If a compatible daemon is reachable, the adapter uses it as primary vector
# source (batched bi-encoder, pre-loaded model) and adds a cross-encoder
# re-ranking stage to search. No daemon → local MiniLM (a standalone engine in
# its own right, not a quality downgrade: once a process has used the daemon it
# waits for a slow daemon and, on failure, disables the vector stage rather than
# silently recomputing with the weaker local model).
#
# Asymmetric prompts: Nemotron-3-Embed declares 'query: ' / 'passage: ' prompts.
# The adapter sends role:'query' for user queries and role:'document' for stored
# patterns; against a daemon that predates the field it prefixes the text itself.
# Measured without those prefixes: a related pair scored 0.694 and an unrelated
# one 0.562 — i.e. no separation at all.
#
# Compatible daemon: MnemoClaw embed-daemon (embed_server.py) — protocol:
# GET /health (exposes prompts/asymmetric), POST /embed-batch (role),
# POST /rerank-immune.
# Env overrides: EMBED_PORT (port), IMMUNE_EMBED_DAEMON=off|on (enabled).
# Probe caching: a healthy daemon is trusted for 30s, a failed probe is
# remembered for 60s (a daemon that comes up later is picked up automatically).
embed_daemon:
  enabled: "auto"      # auto (probe /health) | on | off
  port: 8091           # daemon HTTP port (env EMBED_PORT wins)

indexing:
  max_chunks: 2000
  chunk_size_tokens: 400
  chunk_overlap_tokens: 80
  engine: "fts4"
  tokenizer: "porter"

# Duplicate detection (engine-aware — the two engines do not share a scale)
dedup:
  # local MiniLM (384 dims)
  threshold_embedding_local: 0.70
  # daemon Nemotron (2048 dims), document-vs-document, re-measured 2026-10-08
  # once the daemon applied its asymmetric prompts: true duplicate paraphrases
  # 0.778-0.962, near-miss 0.657, unrelated 0.332-0.436.
  # (Before that fix true dups peaked at 0.768, so the old 0.80 threshold could
  # never fire: daemon dedup was silently dead.)
  threshold_embedding_daemon: 0.75
  threshold_jaccard: 0.55
  # Cosine alone overlaps the two clusters (dups 0.54-0.94 vs near-misses
  # 0.58-0.89), so on the daemon the cosine only proposes the 8 closest
  # candidates and the cross-encoder decides (CE >= 0.45 → same rule).
  cross_encoder_threshold: 0.45
  cross_encoder_candidates: 8
  cosine_prefilter: 0.40

locking:
  enabled: true
  stale_ms: 10000
  retries: 5

sanitizer:
  enabled: true

# ============================================================
# ContextMemory + Score + Flush
# ============================================================

context_memory:
  log_dir: "context"
  retention_hot_days: 90
  archive_dir: "context/archive"
  index_memory_md: true
  memory_md_path: "../MEMORY.md"
  user_md_path: "USER.md"

scoring:
  base: 100
  deductions:
    critical: 20
    warning: 10
    info: 5
  default_baseline:
    mean: 75
    std: 10

deduplication:
  engine: "auto"            # "auto" (embeddings if available, else jaccard) | "embeddings" | "jaccard"
  model: "Xenova/all-MiniLM-L6-v2"   # Local bi-encoder (384 dims, ~22MB, WASM)
  threshold_embedding: 0.70    # Local MiniLM cosine threshold (natural gap: non-dup <0.56, dup >0.74)
  threshold_embedding_daemon: 0.80  # Daemon Nemotron (2048 dims) threshold — tuned in production
                                     # (2026-07-17: true dup 0.802, near-miss 0.789). The adapter
                                     # picks the threshold automatically from the active engine.
                                     # If you point EMBED_PORT at a daemon with ANOTHER model, re-tune it.
  threshold_jaccard: 0.55    # Score threshold for Jaccard fallback
  weights:                   # Jaccard fallback weights
    jaccard: 0.5             # Word overlap (Jaccard index)
    substring: 0.3           # Longest common contiguous word sequence
    domain: 0.2              # Same domain bonus (1.0 if match, 0.0 if not)

flush:
  quality_gate: true
  min_pattern_length: 20
  require_fields:
    antibody: ["id", "pattern", "severity", "correction"]
    strategy: ["id", "pattern"]

# Housekeeping — memory limits + smart archival
housekeeping:
  max_antibodies: 500
  max_strategies: 300
  max_sqlite_mb: 50
  max_context_files: 500
  # Archive criteria (ALL must be true to archive):
  #   - COLD (not HOT)
  #   - severity != critical (antibodies) OR effectiveness < 0.3 (strategies)
  #   - seen_count <= 1 (never proved useful)
  #   - last_seen > 180 days ago
  # Archived items go to archived_antibodies.json / archived_strategies.json
  archive_after_days: 180
  archive_min_seen: 1